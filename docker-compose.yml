services:
  db:
    image: postgres:16-alpine
    container_name: mowetter-db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: mowetter
      POSTGRES_USER: mowetter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mowetter_dev_password}
    volumes:
      - mowetter_postgres_data:/var/lib/postgresql/data
    networks:
      - mowetter_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mowetter -d mowetter"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: mowetter-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://mowetter:${POSTGRES_PASSWORD:-mowetter_dev_password}@db:5432/mowetter
      FORECAST_CACHE_TTL_SECONDS: "900"
      FORECAST_REFRESH_SECONDS: "900"
      ENABLE_API_DOCS: "${ENABLE_API_DOCS:-0}"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8020:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mowetter_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.5.2
    container_name: mowetter-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://web:8000 mowetter
    volumes:
      - /home/moot/.cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - mowetter_net

volumes:
  mowetter_postgres_data:

networks:
  mowetter_net:
